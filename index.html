<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GATE Prep Board — CSE and DS &amp; AI</title>
<meta name="description" content="Preparation board for GATE CSE and GATE Data Science &amp; AI: free resource library, chapter checklist, practice quizzes, generated mock tests and a progress tracker kept in a SQLite database in your own browser. No login.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<div class="shell">

  <!-- desktop rail -->
  <aside class="rail">
    <div class="brand">
      <b>GATE Prep Board</b>
      <span>Free resources, quizzes, mocks, progress</span>
    </div>

    <div class="seg" role="group" aria-label="Choose paper">
      <button data-exam="cse" aria-pressed="true">CSE</button>
      <button data-exam="da" aria-pressed="false">DS &amp; AI</button>
    </div>

    <nav class="nav" id="nav" aria-label="Sections"></nav>

    <div class="rail-foot">
      <button class="btn quiet sm" id="themebtn">Dark mode</button>
      <p class="faint" style="margin-top:12px">No account needed. Progress is kept in a SQLite database inside this browser and can be downloaded as a file.</p>
    </div>
  </aside>

  <!-- mobile top bar -->
  <div style="flex:1;min-width:0">
    <header class="topbar">
      <b>GATE Prep Board</b>
      <div class="row" style="gap:6px">
        <div class="seg" style="margin:0" role="group" aria-label="Choose paper">
          <button data-exam="cse" aria-pressed="true">CSE</button>
          <button data-exam="da" aria-pressed="false">DS &amp; AI</button>
        </div>
      </div>
    </header>

    <main class="main" id="view" aria-live="polite">
      <noscript><p>This board needs JavaScript switched on.</p></noscript>
      <div class="card" id="bootnote"><p class="wait">Opening your progress database&#8230;</p></div>
    </main>
  </div>
</div>

<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<script src="assets/js/data/syllabus.js"></script>
<script src="assets/js/data/resources.js"></script>
<script src="assets/js/data/questions.cse.js"></script>
<script src="assets/js/data/questions.math.js"></script>
<script src="assets/js/data/questions.da.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/quiz.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
